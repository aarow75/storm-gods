<div class="app-container" [class.runequest-theme]="gameSystemService.gameSystem() === 'runequest'" [class.dragonbane-theme]="gameSystemService.gameSystem() === 'dragonbane'">
  <header>
    <div class="header-content">
      <div class="header-left">
        <h1><img src="{{ gameSystemService.getSystemName() }}-logo.png"></h1>
      </div>
      <div class="header-right">
        <button class="btn-dice-roller" (click)="toggleDiceModal()" [class.active]="diceModalOpen()" title="Dice Roller">
          <span class="dice-icon">🎲</span>
        </button>
        <a [routerLink]="gameSystemService.link('settings')" class="settings-link" title="Settings">
          <span class="settings-icon">⚙️</span>
        </a>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <a [routerLink]="gameSystemService.link('characters')" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F465;</span>
      <span>Characters</span>
    </a>
    <a [routerLink]="gameSystemService.link('bestiary')" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F409;</span>
      <span>Bestiary</span>
    </a>
    <a [routerLink]="gameSystemService.link('combat')" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x2694;&#xFE0F;</span>
      <span>Combat</span>
    </a>
    <a [routerLink]="gameSystemService.link('wilderness-map')" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F5FA;</span>
      <span>Maps</span>
    </a>
    <a [routerLink]="gameSystemService.link('docs')" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F4DA;</span>
      <span>Docs</span>
    </a>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>

  @if (diceModalOpen()) {
  <div class="dice-modal-backdrop" (click)="closeDiceModal()"></div>
  <div class="dice-modal" role="dialog" aria-label="Dice Roller">
    <div class="dice-modal-header">
      <span class="dice-modal-title">Dice Roller</span>
      <button class="dice-modal-close" (click)="closeDiceModal()" aria-label="Close">×</button>
    </div>
    <app-dice-roller [modal]="true"></app-dice-roller>
  </div>
  }
</div>
