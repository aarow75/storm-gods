<div class="app-container" [class.runequest-theme]="gameSystemService.gameSystem() === 'runequest'" [class.dragonbane-theme]="gameSystemService.gameSystem() === 'dragonbane'">
  <header>
    <div class="header-content">
      <div class="header-left">
        <h1>{{ gameSystemService.getSystemName() }} {{ translationService.get('app.title', 'Character Manager') }}</h1>
      </div>
      <div class="header-right">
        <a routerLink="/settings" class="settings-link" title="{{ translationService.get('settings.title', 'Settings') }}">
          <span class="settings-icon">⚙️</span>
        </a>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <a routerLink="/characters" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F465;</span>
      <span>Characters</span>
    </a>
    <a routerLink="/bestiary" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F409;</span>
      <span>Bestiary</span>
    </a>
    <a routerLink="/combat" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x2694;&#xFE0F;</span>
      <span>Combat Tracker</span>
    </a>
    <a routerLink="/rules" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">&#x1F4D6;</span>
      <span>Rules Reference</span>
    </a>
  </nav>

  <main>
    @if (showDiceRoller() && translationService.hasTranslation('diceRoller.title')) {
      <app-dice-roller></app-dice-roller>
    }
    <router-outlet></router-outlet>
  </main>
</div>
