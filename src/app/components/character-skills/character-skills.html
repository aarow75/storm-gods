@if (heading) {
<h4>{{ heading }} <button type="button" class="btn-calculate" (click)="applyBonuses.emit()">{{ translationService.get('button.applyBonuses', 'Apply Skill Bonuses') }}</button></h4>
}
<div class="skills-section">
  @for (category of getCategoryKeys(); track category) {
  <div class="skill-category">
    <h5>{{ category }}</h5>
    <div class="skills-grid">
      @for (skill of getSkillKeys(category); track skill) {
      <div class="form-group skill-group">
        <label [for]="skill">{{ skill }}:</label>
        <div class="skill-input-wrapper">
          <input
            type="number"
            [id]="skill"
            [(ngModel)]="skills[skill]"
            [name]="skill"
            min="0"
            max="100"
          />
          <span class="d20-equivalent">d20: {{ percentageToD20(skills[skill]) }}</span>
        </div>
      </div>
      }
    </div>
  </div>
  }
</div>
