@if (heading) {
<h4>{{ heading }}</h4>
}

@if (isRuneQuest) {
  <!-- Armor type selector (worn armor) -->
  <div class="form-group">
    <label for="armor-type">Worn Armor Type:</label>
    <select
      id="armor-type"
      [(ngModel)]="armorType"
      (ngModelChange)="armorTypeChange.emit($event)"
      name="armor-type"
    >
      @for (type of armorTypes; track type.name) {
        <option [value]="type.name">{{ type.name }} ({{ type.points }} AP)</option>
      }
    </select>
  </div>


  <!-- RuneQuest: Hit location-based armor -->
  <div class="armor-grid">
    @for (location of getArmorLocationKeys(); track location) {
      <div class="form-group">
        <label [attr.for]="'armor-' + location">{{ location }}</label>
        <input
          type="number"
          [id]="'armor-' + location"
          [(ngModel)]="armor[location]"
          [name]="'armor-' + location"
          min="0"
        />
      </div>
    }
  </div>
  <button type="button" class="btn-calculate" (click)="applyArmorToAll()">
    Apply to All
  </button>
} @else {
  <!-- Dragonbane: Single armor rating -->
  <div class="single-armor">
    <div class="form-group">
      <label for="armor-rating">Armor Rating:</label>
      <input
        type="number"
        id="armor-rating"
        [(ngModel)]="singleArmorRating"
        name="armor-rating"
        min="0"
        max="10"
      />
    </div>
    <p class="armor-hint">In Dragonbane, armor is a single value that applies to your whole body.</p>
  </div>
}
