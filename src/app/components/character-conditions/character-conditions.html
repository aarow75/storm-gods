@if (heading) {
<h4>{{ heading }}</h4>
}

<div class="form-group">
  <div class="condition-input-wrapper">
    <input
      type="text"
      [(ngModel)]="newCondition"
      name="newCondition"
      (keypress)="onKeyPress($event)"
      placeholder="Enter condition (e.g., diseased, poisoned)"
      class="condition-input"
    />
    <button
      type="button"
      class="btn btn-secondary"
      (click)="addCondition()"
      [disabled]="!newCondition.trim()">
      Add
    </button>
  </div>

  @if (conditions.length === 0) {
    <p class="empty-state">No active conditions</p>
  } @else {
    <div class="condition-tags">
      @for (condition of conditions; track condition) {
        <div class="condition-tag">
          <span class="condition-name">{{ condition }}</span>
          <button
            type="button"
            class="btn-remove"
            (click)="removeCondition(condition)"
            title="Remove"
            aria-label="Remove {{ condition }}">
            ×
          </button>
        </div>
      }
    </div>
  }

  <div class="condition-presets">
    <p class="presets-label">Quick add:</p>
    <div class="preset-buttons">
      @for (cond of commonConditions; track cond) {
        <button
          type="button"
          class="btn btn-preset"
          (click)="addCommonCondition(cond)"
          [disabled]="conditions.includes(cond)">
          {{ cond }}
        </button>
      }
    </div>
  </div>
</div>
