<!-- EXAMPLE: Using the new child components in character-form.component.html -->
<!-- This shows how to replace the monolithic form with modular components -->

<div class="character-form" [class.edit-mode]="editMode">
  <h3>{{ editMode ? 'Edit Character' : 'Create New Character' }}</h3>
  <div *ngIf="editMode" class="edit-banner">
    Editing: {{ character.name }}
  </div>

  <div *ngIf="showValidationErrors" class="validation-banner">
    <div class="validation-banner-header">
      <span class="validation-banner-title">Required fields missing</span>
      <button type="button" class="btn-dismiss" (click)="dismissValidationErrors()">×</button>
    </div>
    <div class="validation-banner-content">
      <p>Please fill in the following required fields:</p>
      <ul>
        <li *ngFor="let error of validationErrorList">{{ error }}</li>
      </ul>
    </div>
  </div>

  <form (ngSubmit)="saveCharacter()">
    <div *ngIf="!editMode" class="randomize-section">
      <button type="button" class="btn-randomize" (click)="randomizeCharacter()">
        Randomize Character
      </button>
      <p class="randomize-hint">Generates random stats, cult, occupation, and homeland</p>
    </div>

    <!-- Character Name (still in main form) -->
    <div class="form-group">
      <label for="name"
        [class.required-label]="isFieldInvalid('name')"
        [class.success-label]="isFieldRandomized('name') && !isFieldInvalid('name')">
        Character Name: <span class="required-star">*</span>
      </label>
      <input
        type="text"
        id="name"
        [(ngModel)]="character.name"
        name="name"
        required
        placeholder="Enter character name"
        [class.invalid-field]="isFieldInvalid('name')"
        [class.success-field]="isFieldRandomized('name') && !isFieldInvalid('name')"
      />
      <span *ngIf="isFieldInvalid('name')" class="validation-error">Required field</span>
      <span *ngIf="isFieldRandomized('name') && !isFieldInvalid('name')" class="success-message">Randomized</span>
    </div>

    <!-- Background Component -->
    <app-character-background
      [background]="character.background!"
      [cults]="cults"
      [occupations]="occupations"
      [homelands]="homelands"
      [isFieldInvalid]="isFieldInvalid.bind(this)"
      [isFieldRandomized]="isFieldRandomized.bind(this)"
      (cultChange)="onCultChange()"
    ></app-character-background>

    <!-- Family History Component -->
    <app-character-family-history
      [familyHistory]="character.familyHistory!"
      (addEvent)="addFamilyEvent()"
      (removeEvent)="removeFamilyEvent($event)"
    ></app-character-family-history>

    <!-- Characteristics Component -->
    <app-character-characteristics
      [stats]="character.stats!"
      [isFieldInvalid]="isFieldInvalid.bind(this)"
      [isFieldRandomized]="isFieldRandomized.bind(this)"
      (rollAll)="rollAll3D6()"
      (rollStat)="roll3D6($event)"
    ></app-character-characteristics>

    <!-- Skills Component -->
    <app-character-skills
      [skills]="character.skills!"
      [skillCategories]="skillCategories"
      [getCategoryKeys]="getCategoryKeys.bind(this)"
      [getSkillKeys]="getSkillKeys.bind(this)"
      (applyBonuses)="applyAllSkillBonuses()"
    ></app-character-skills>

    <!-- Derived Stats Component -->
    <app-character-derived-stats
      [derivedStats]="character.derivedStats!"
      (calculate)="calculateDerivedValues()"
    ></app-character-derived-stats>

    <!-- Hit Locations Component (Placeholder) -->
    <app-character-hit-locations
      [hitLocations]="character.hitLocations!"
    ></app-character-hit-locations>

    <!-- Armor Component (Placeholder) -->
    <app-character-armor
      [armor]="character.armor!"
    ></app-character-armor>

    <!-- Weapons Component (Placeholder) -->
    <app-character-weapons
      [weapons]="character.weapons!"
    ></app-character-weapons>

    <!-- Runes Component (Placeholder) -->
    <app-character-runes
      [runes]="character.runes!"
    ></app-character-runes>

    <!-- Cult Status Component (Placeholder) -->
    <app-character-cult-status
      [cultStatus]="character.cultStatus!"
    ></app-character-cult-status>

    <!-- Passions Component (Placeholder) -->
    <app-character-passions
      [passions]="character.passions!"
    ></app-character-passions>

    <!-- Magic Component (Placeholder) -->
    <app-character-magic
      [magic]="character.magic!"
    ></app-character-magic>

    <!-- Resources Component (Placeholder) -->
    <app-character-resources
      [resources]="character.resources!"
    ></app-character-resources>

    <!-- Equipment Component (Placeholder) -->
    <app-character-equipment
      [equipment]="character.equipment!"
    ></app-character-equipment>

    <!-- Notes Component (Placeholder) -->
    <app-character-notes
      [notes]="character.notes!"
    ></app-character-notes>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="submit" class="btn-primary">
        {{ editMode ? 'Update Character' : 'Save Character' }}
      </button>
      <button *ngIf="editMode" type="button" class="btn-secondary" (click)="cancelEdit()">
        Cancel
      </button>
    </div>
  </form>
</div>
