@if (heading) {
<h4>{{ heading }}</h4>
}
<div class="cult-status-section">
  <div class="form-group">
    <label for="cult-name">{{ translationService.get('cult.name', 'Cult Name') }}:</label>
    <input
      type="text"
      id="cult-name"
      [(ngModel)]="cultStatus.cultName"
      name="cult-name"
      readonly
    />
  </div>
  <div class="form-group">
    <label for="cult-rank">{{ translationService.get('cult.rank', 'Rank') }}:</label>
    <select
      id="cult-rank"
      [(ngModel)]="cultStatus.rank"
      name="cult-rank"
    >
      @for (rank of cultRanks; track rank) {
        <option [value]="rank">{{ rank }}</option>
      }
    </select>
  </div>
</div>
