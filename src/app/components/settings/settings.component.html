<div class="settings-container">
  <h1>⚙️ Settings</h1>

  <div class="settings-section">
    <h2>Game System</h2>
    <p style="margin: 0 0 var(--spacing-3xl) 0; color: var(--color-gray-600); font-size: var(--font-size-base);">
      Choose which game system to use for your characters
    </p>
    <div class="button-group">
      <button
        (click)="switchSystem('runequest')"
        [class.active]="gameSystemService.gameSystem() === 'runequest'"
        class="system-toggle-btn system-toggle-rq">
        RuneQuest
      </button>
      <button
        (click)="switchSystem('dragonbane')"
        [class.active]="gameSystemService.gameSystem() === 'dragonbane'"
        class="system-toggle-btn system-toggle-db">
        Dragonbane
      </button>
    </div>
  </div>

  <div class="settings-section">
    <h2>Text Size</h2>
    <p style="margin: 0 0 var(--spacing-3xl) 0; color: var(--color-gray-600); font-size: var(--font-size-base);">
      Adjust the text size for better readability
    </p>
    <div class="button-group">
      <button (click)="decreaseFontSize()" class="font-size-btn" title="Decrease font size" aria-label="Decrease text size">−</button>
      <button (click)="resetFontSize()" class="font-size-btn font-size-reset" title="Reset to default" aria-label="Reset text size to default">Reset</button>
      <button (click)="increaseFontSize()" class="font-size-btn" title="Increase font size" aria-label="Increase text size">+</button>
    </div>
  </div>
</div>
