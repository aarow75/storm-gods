@if (heading) {
<h4>{{ heading }}</h4>
}
@if (showRollButtons) {
<div class="quick-roll">
  <button type="button" class="btn btn-roll-all" (click)="rollAll.emit()">
    {{ rollButtonLabel }}
  </button>
</div>
}

<div class="stats-grid">
  <div class="form-group">
    <label for="str" [class.success-label]="isFieldRandomized('str')">{{ strLabel }}:</label>
    <div class="input-with-dice">
      <input
        type="number"
        id="str"
        [(ngModel)]="stats.STR"
        name="str"
        [min]="statMin"
        [max]="statMax"
        required
        [class.success-field]="isFieldRandomized('str')"
      />
      @if (showRollButtons) {<button type="button" class="btn-dice" (click)="rollStat.emit('STR')" title="Roll 3d6">3d6</button>}
    </div>
  </div>

  <div class="form-group">
